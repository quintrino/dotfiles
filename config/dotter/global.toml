
# ZSH configuration
[zsh]
depends = ["base"]

[zsh.files]
"shell/zsh/rc" = "$XDG_CONFIG_HOME/zsh/.zshrc"

# Fish configuration
[fish]
depends = ["base"]

[fish.files]
"shell/fish/rc" = "$XDG_CONFIG_HOME/fish/config.fish"
"shell/fish/plugins" = "$XDG_CONFIG_HOME/fish/fish_plugins"

[bash.files]
"shell/bash/bashrc" = "$XDG_CONFIG_HOME/bash/profile"
"shell/bash/rc" = "$XDG_CONFIG_HOME/bash/bash"

[apps.files]
"apps/Alacritty" = { target = "/Applications/Alacritty.app", type = "symbolic" }

[bin.files]
"shell/utilities/" = "$XDG_DATA_HOME/bin/"

[config.files]
"config/espanso" =  { target = "$XDG_CONFIG_HOME/espanso/", type = "symbolic" }
"config/zellij" = { target = "$XDG_CONFIG_HOME/zellij/", type = "symbolic" }
"config/teeldear" = { target = "$XDG_CONFIG_HOME/teeldear/", type = "symbolic" }
"config/bettercmdtab" = { target = "$XDG_CONFIG_HOME/bettercmdtab/", type = "symbolic" }
"config/helix" = { target = "$XDG_CONFIG_HOME/helix/", type = "symbolic" }
"config/mise/config.toml" = { target = "$XDG_CONFIG_HOME/mise/config.toml", type = "symbolic" }

"config/organize/config.yaml" = "$XDG_CONFIG_HOME/organize/config.yaml"
"config/aerospace/aerospace.toml" = "$XDG_CONFIG_HOME/aerospace/aerospace.toml"
"config/tmux/tmux.conf" = "$XDG_CONFIG_HOME/tmux/tmux.conf"
"config/starship/starship" = "$XDG_CONFIG_HOME/starship.toml"
"config/alacritty/alacritty.toml" = "$XDG_CONFIG_HOME/alacritty/alacritty.toml"
"config/beeminder/bmndrrc" = "$XDG_CONFIG_HOME/.bmndrrc"
"config/exercism/user.json" = "$XDG_CONFIG_HOME/exercism/user.json"
"config/hub/config" = "$XDG_CONFIG_HOME/hub"
"config/biome/default.json" = "$XDG_CONFIG_HOME/biome/default.json"
"config/nimble/config.json" = "$HOME/Library/Application Support/Nimble Commander/Config/Config.json"


[git.files]
"config/git/ignore" = "$XDG_CONFIG_HOME/git/ignore"
"config/git/config" = "$XDG_CONFIG_HOME/git/config"

[ruby.files]
"language/ruby/pryrc" = "$XDG_CONFIG_HOME/pry/pryrc"
"language/ruby/irbrc" = "$XDG_CONFIG_HOME/ruby/irbrc"
"language/ruby/gemrc" = "$XDG_CONFIG_HOME/ruby/gemrc"
"language/ruby/railsrc" = "$XDG_CONFIG_HOME/rails/railsrc"
"language/ruby/rspec" = "$XDG_CONFIG_HOME/rspec/options"
"language/ruby/default-gems" = "$XDG_CONFIG_HOME/mise/ruby"

[nodejs.files]
"language/nodejs/npmrc" = "$XDG_CONFIG_HOME/npm/npmrc"
"language/nodejs/default-packages" = "$XDG_CONFIG_HOME/mise/nodejs"

[tasks.files]
"shell/tasks/slumber.plist" = "$HOME/Library/LaunchAgents/com.user.alfred.slumber.plist"
"shell/tasks/lockscreen.plist" = "$HOME/Library/LaunchAgents/local.timed_lockscreen.plist"
"shell/tasks/lockscreen.sh" = "$HOME/Library/LaunchAgents/Scripts/local.timed_lockscreen.sh"
