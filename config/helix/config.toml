theme = "catppuccin_macchiato"

[editor]
cursorline = true
scrolloff = 8
color-modes = true
true-color = true
undercurl = true
rulers = [80, 120]
popup-border = "all"
whitespace.render = { space = "all", tab = "all" }

[keys.insert]
"A-C-c" = "toggle_comments"
"A-C-p" = "command_palette"
"A-e" = ":quit" # Command + e to exit

[keys.normal]
"A-e" = ":quit" # Command + e to exit
"J" = [
  "extend_to_line_bounds",
  "delete_selection",
  "paste_after",
  "select_mode",
  "goto_line_start",
  "normal_mode",
] # Move line(s) down
"K" = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
  "flip_selections",
] # Move line(s) up
"A-C-p" = "command_palette"
"A-C-c" = "toggle_comments"

[keys.select]
"A-C-p" = "command_palette"
