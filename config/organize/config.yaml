rules:
  # Desktop
  - locations: "~/Desktop"
    subfolders: false
    actions:
      - move: "~/Downloads/"

  # Folders
    locations: ~/Downloads
    targets: dirs          # match folders instead of files
    subfolders: false      # set true to recurse
    filters:
      - not name:
          startswith:
            - Archives
            - Books
            - Code
            - Documents
            - Directories
            - Images
            - Installers
            - Music
            - Spreadsheets
            - Tickets
            - Videos
    actions:
      - echo: "Non-matching folder: {path}"
      - move: "~/Downloads/Directories/"

  # Images
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
            "< 0.5 GB"
      - extension:
          - jpg
          - jpeg
          - png
          - gif
          - bmp
          - svg
          - webp
          - ico
          - tiff
          - heic
    actions:
      - move: "~/Downloads/Images/"

  # Documents
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - apkg
          - pdf
          - doc
          - docx
          - txt
          - rtf
          - odt
          - pages
    actions:
      - move: "~/Downloads/Documents/"

  # Spreadsheets
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - xls
          - xlsx
          - csv
          - ods
          - numbers
    actions:
      - move: "~/Downloads/Spreadsheets/"

  # Presentations
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - ppt
          - pptx
          - key
          - odp
    actions:
      - move: "~/Downloads/Presentations/"


  # Tickets
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - pkpass
          - pkpasses
    actions:
      - move: "~/Downloads/Tickets/"

  # Videos
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - mp4
          - avi
          - mov
          - mkv
          - flv
          - wmv
          - webm
          - m4v
          - mpeg
    actions:
      - move: "~/Downloads/Videos/"

  # Audio
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - mp3
          - wav
          - flac
          - aac
          - ogg
          - m4a
          - wma
    actions:
      - move: "~/Downloads/Audio/"

  # Archives
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - zip
          - rar
          - 7z
          - tar
          - gz
          - bz2
          - xz
          - iso
    actions:
      - move: "~/Downloads/Archives/"

  # Code
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - py
          - js
          - html
          - css
          - java
          - cpp
          - c
          - d
          - go
          - rs
          - php
          - rb
          - scpt
          - swift
          - kt
          - ts
          - jsx
          - tsx
          - vue
          - json
          - xml
          - yaml
          - yml
          - alfredworkflow
    actions:
      - move: "~/Downloads/Code/"

  # Executables/Installers
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - exe
          - msi
          - dmg
          - pkg
          - deb
          - rpm
          - appimage
          - apk
    actions:
      - move: "~/Downloads/Installers/"

  # eBooks
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - epub
          - mobi
          - azw
          - azw3
    actions:
      - move: "~/Downloads/Books/"

  # Markdown
  - locations: "~/Downloads"
    subfolders: false
    filters:
      - size:
          "< 0.5 GB"
      - extension:
          - md
          - markdown
    actions:
      - move: "~/Documents/obsidian/Backlog/"

  # Home Directory new file
    locations: "{env.HOME}"
    targets: dirs          # match folders instead of files
    subfolders: false      # set true to recurse
    filters:
      - not name:
          startswith:
            - .Trash
            - .cache
            - .config
            - .local
            - .ssh
            - Applications
            - Desktop
            - Developer
            - Documents
            - Downloads
            - Library
            - Movies
            - Music
            - Pictures
            - Public
    actions:
      - echo: "Non-matching folder: {path}"
